<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>HeartSync - AI Powered Dating</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0a0a0a;
      color: white;
      overflow-x: hidden;
    }
    .gradient-pink {
      background: linear-gradient(135deg, #f472b6 0%, #db2777 100%);
    }
    .glass-effect {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .swipe-card {
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }
    
    @keyframes hype-float {
      0% { transform: translateY(0) scale(0.5); opacity: 0; }
      20% { opacity: 1; transform: translateY(-20px) scale(1.2); }
      100% { transform: translateY(-300px) translateX(var(--drift)) scale(1.5); opacity: 0; }
    }
    .animate-hype {
      animation: hype-float 1.5s ease-out forwards;
    }
    @keyframes token-deduct {
      0% { transform: translateY(0) scale(1.2); opacity: 1; }
      100% { transform: translateY(-40px) scale(0.8); opacity: 0; }
    }
    .animate-token-deduct {
      animation: token-deduct 1.2s ease-out forwards;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
